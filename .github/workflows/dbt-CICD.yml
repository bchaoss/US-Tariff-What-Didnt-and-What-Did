name: dbt_pipeline_cicd

env:
  MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
  DBT_PROJECT_DIR: ${{ github.workspace }}/pipeline
  DBT_PROFILES_DIR: ${{ github.workspace }}/pipeline/.dbt

on:
  push:
    branches: [ "main" ]
    paths:
      - 'pipeline/**'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-dbt-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
        
      - name: Install dbt dependencies
        run: pip install -r requirements.txt
  
      - name: Set up dbt profiles
        run: |
          mkdir -p ${{ env.DBT_PROJECT_DIR }}/.dbt
          cp ${{ env.DBT_PROJECT_DIR }}/profiles.yml ${{ env.DBT_PROFILES_DIR }}/profiles.yml
        shell: bash

      - name: Run dbt deps
        run: dbt deps
        working-directory: ${{ env.DBT_PROJECT_DIR }}
  
      - name: Run dbt test
        run: dbt test
        working-directory: ${{ env.DBT_PROJECT_DIR }}

      - name: Run dbt
        run: dbt run
        working-directory: ${{ env.DBT_PROJECT_DIR }}

      # - name: Generate dbt doc
      #   run: dbt docs generate 
      #   working-directory: ${{ env.DBT_PROJECT_DIR }}